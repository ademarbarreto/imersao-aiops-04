name: kube-news

services:
  app:
    build:
      context: ./src
    image: kube-news:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-kubedevnews}
      DB_USERNAME: ${DB_USERNAME:-kubedevnews}
      DB_PASSWORD: ${DB_PASSWORD:-Pg#123}
      DB_SSL_REQUIRE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kube-news

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kubedevnews}
      POSTGRES_USER: ${DB_USERNAME:-kubedevnews}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Pg#123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kubedevnews} -d ${DB_DATABASE:-kubedevnews}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - kube-news

volumes:
  postgres-data:

networks:
  kube-news:
